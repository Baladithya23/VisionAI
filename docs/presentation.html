<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionAI — Presentation Deck</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.85);
      --border: rgba(99, 102, 241, 0.25);
      --accent: #6366f1;
      --accent-glow: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .presentation-container {
      width: 90vw;
      max-width: 1100px;
      height: 82vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(99, 102, 241, 0.15);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .badge {
      background: rgba(99, 102, 241, 0.2);
      color: var(--accent-glow);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .slide-body {
      flex: 1;
      padding: 36px 48px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 20px;
    }
    p, li {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #cbd5e1;
    }
    ul { margin-left: 24px; margin-bottom: 16px; }
    li { margin-bottom: 10px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 12px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px;
      border-radius: 12px;
    }
    .card h3 {
      font-size: 1.2rem;
      color: var(--accent-glow);
      margin-bottom: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
    }
    th {
      color: var(--accent-glow);
      font-weight: 600;
      background: rgba(99, 102, 241, 0.1);
    }
    td.high { color: var(--success); font-weight: bold; }
    .speaker-notes-box {
      background: rgba(0, 0, 0, 0.35);
      border-top: 1px dashed rgba(255,255,255,0.15);
      padding: 12px 28px;
      font-size: 0.85rem;
      color: #94a3b8;
      max-height: 90px;
      overflow-y: auto;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.2);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover {
      background: var(--accent-glow);
      transform: translateY(-1px);
    }
    button:disabled {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.3);
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>

let currentSlide = 0;

function renderSlide() {
  const slide = slides[currentSlide];
  document.getElementById("slide-num").innerText = `Slide ${currentSlide + 1} / ${slides.length}`;
  document.getElementById("slide-content").innerHTML = slide.html;
  document.getElementById("speaker-notes").innerHTML = `<strong>Speaker Notes:</strong> ${slide.notes}`;
  
  document.getElementById("prev-btn").disabled = currentSlide === 0;
  document.getElementById("next-btn").disabled = currentSlide === slides.length - 1;
}

function nextSlide() {
  if (currentSlide < slides.length - 1) {
    currentSlide++;
    renderSlide();
  }
}

function prevSlide() {
  if (currentSlide > 0) {
    currentSlide--;
    renderSlide();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === " ") nextSlide();
  if (e.key === "ArrowLeft") prevSlide();
});

renderSlide();
</script>
